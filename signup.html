<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobSphere - Create Account</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            margin: 0;
            background: #f4f7fc;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #172033;
            height: 65px;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .signup-section {
            min-height: calc(100vh - 65px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .signup-box {
            width: 450px;
            background: white;
            padding: 35px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .signup-icon {
            width: 65px;
            height: 65px;
            background: #e8f0ff;
            color: #2463df;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 27px;
        }

        .signup-title {
            color: #172033;
            font-weight: bold;
            margin-top: 18px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .form-control,
        .form-select {
            height: 48px;
            border-radius: 8px;
        }

        .password-box {
            position: relative;
        }

        .password-box i {
            position: absolute;
            right: 15px;
            top: 16px;
            cursor: pointer;
            color: #777;
        }

        .signup-btn {
            width: 100%;
            height: 48px;
            background: #2463df;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .signup-btn:hover {
            background: #174db8;
        }

        #error {
            color: red;
            font-size: 14px;
            display: none;
        }

        .login-link {
            color: #2463df;
            text-decoration: none;
            font-weight: bold;
        }

        body {
            background: linear-gradient(rgba(15, 23, 42, 0.56), rgba(91, 78, 245, 0.5)),
                url('https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=1600&q=80') center/cover fixed;
            color: #101828;
        }

        .navbar {
            min-height: 76px;
            height: auto;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
        }

        .navbar-brand {
            letter-spacing: -0.03em;
        }

        .signup-section {
            min-height: calc(100vh - 136px);
            padding: 64px 20px;
        }

        .signup-box {
            width: min(100%, 480px);
            background: rgba(255, 255, 255, 0.96);
            padding: 40px 44px;
            border: 1px solid rgba(91, 78, 245, 0.1);
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(91, 78, 245, 0.14);
        }

        .signup-icon {
            background: linear-gradient(135deg, #eef2ff, #fce7f3);
            color: #5b4ef5;
        }

        .form-control,
        .form-select {
            border: 1px solid #dbe2ee;
            border-radius: 12px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #7167ee;
            box-shadow: 0 0 0 0.2rem rgba(91, 78, 245, 0.14);
        }

        .signup-btn {
            height: 52px;
            border-radius: 12px;
            background: linear-gradient(135deg, #5b4ef5, #ff5ea8);
            box-shadow: 0 12px 24px rgba(91, 78, 245, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .signup-btn:hover {
            background: linear-gradient(135deg, #493bdc, #ed4f98);
            transform: translateY(-2px);
            box-shadow: 0 16px 28px rgba(91, 78, 245, 0.25);
        }

        .auth-footer {
            background: #0f172a;
            color: rgba(255, 255, 255, 0.76);
            padding: 18px 0;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">
        <div class="container">

            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-globe"></i>
                JobSphere
            </a>

        </div>
    </nav>


    <!-- Signup Section -->

    <section class="signup-section">

        <div class="signup-box">

            <!-- Icon -->

            <div class="signup-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>


            <h2 class="text-center signup-title">
                Create Account
            </h2>

            <p class="text-center text-muted">
                Join JobSphere and start your career journey
            </p>


            <!-- Signup Form -->

            <form id="signupForm">

                <!-- Full Name -->
                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text" id="name" class="form-control" placeholder="Enter your full name">

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input type="email" id="email" class="form-control" placeholder="Enter your email">

                </div>


                <!-- Role -->

                <div class="mb-3">

                    <label class="form-label">
                        I am a
                    </label>

                    <select id="role" class="form-select">

                        <option value="">
                            Select your role
                        </option>

                        <option value="jobseeker">
                            Job Seeker
                        </option>

                        <option value="employer">
                            Employer
                        </option>

                    </select>

                </div>


                <!-- Password -->

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <div class="password-box">

                        <input type="password" id="password" class="form-control" placeholder="Create a password">

                        <i class="fa-solid fa-eye" id="eye1" onclick="showPassword('password','eye1')">
                        </i>

                    </div>

                </div>


                <!-- Confirm Password -->

                <div class="mb-3">

                    <label class="form-label">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input type="password" id="confirmPassword" class="form-control"
                            placeholder="Confirm your password">

                        <i class="fa-solid fa-eye" id="eye2" onclick="showPassword('confirmPassword','eye2')">
                        </i>

                    </div>

                </div>


                <!-- Terms -->

                <div class="form-check mb-3">

                    <input class="form-check-input" type="checkbox" id="terms">

                    <label class="form-check-label">
                        I agree to the Terms & Conditions
                    </label>

                </div>


                <!-- Error -->

                <p id="error">
                    Please fill all details correctly.
                </p>


                <!-- Button -->

                <button type="submit" class="signup-btn">

                    <i class="fa-solid fa-user-plus"></i>
                    Create Account

                </button>

            </form>

            <hr class="my-4">
            <!-- Login Link -->

            <p class="text-center mb-0">

                Already have an account?

                <a href="login.html" class="login-link">
                    Login
                </a>

            </p>

        </div>

    </section>

    <footer class="auth-footer">
        <div class="container">JobSphere &middot; Explore opportunities. Build your career.</div>
    </footer>


    <!-- JavaScript -->

    <script>

        // Password Show / Hide

        function showPassword(inputId, eyeId) {

            var password = document.getElementById(inputId);
            var eye = document.getElementById(eyeId);

            if (password.type == "password") {

                password.type = "text";

                eye.classList.remove("fa-eye");
                eye.classList.add("fa-eye-slash");

            } else {

                password.type = "password";

                eye.classList.remove("fa-eye-slash");
                eye.classList.add("fa-eye");

            }

        }


        // Signup Validation

        document.getElementById("signupForm").addEventListener("submit", function (event) {

            event.preventDefault();

            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var role = document.getElementById("role").value;
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("confirmPassword").value;
            var terms = document.getElementById("terms").checked;
            var error = document.getElementById("error");

            if (name == "" ||
                email == "" ||
                role == "" ||
                password == "" ||
                confirmPassword == "") {

                error.innerText = "Please fill all the details.";
                error.style.display = "block";

            }
            else if (password != confirmPassword) {
                error.innerText = "Passwords do not match.";
                error.style.display = "block";
            }

            else if (!terms) {
                error.innerText = "Please agree to the Terms & Conditions.";
                error.style.display = "block";
            }

            else {
                error.style.display = "none";
                alert("Account created successfully!");
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
