<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobSphere - Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background-image:
                linear-gradient(rgba(17, 24, 39, 0.55), rgba(17, 24, 39, 0.55)),
                url("https://static.vecteezy.com/system/resources/thumbnails/041/287/277/small_2x/a-laptop-computer-on-a-wooden-desk-in-a-modern-office-on-a-skyscraper-at-night-with-night-city-view-photo.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login Card */
        .login-card {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.97);
            padding: 40px;
            border-radius: 22px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3);

            animation: fadeIn 0.6s ease;
        }

        /* Logo */
        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: #5b4ef5;
            margin-bottom: 8px;
        }

        .logo i {
            margin-right: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        /* Labels */
        .form-label {
            font-weight: 600;
            color: #374151;
        }

        /* Inputs */
        .form-control {
            height: 48px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            padding: 10px 15px;
        }

        .form-control:focus {
            border-color: #5b4ef5;
            box-shadow: 0 0 0 3px rgba(91, 78, 245, 0.12);
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;

            background: linear-gradient(135deg, #5b4ef5, #ff5ea8);

            color: white;
            font-size: 16px;
            font-weight: 600;

            transition: 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(91, 78, 245, 0.3);
        }

        /* Error */
        #error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 8px;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <!-- Logo -->
        <div class="logo">
            <i class="fa-solid fa-briefcase"></i>
            JobSphere
        </div>

        <p class="subtitle">
            Login to continue your career journey
        </p>

        <!-- Login Form -->
        <form onsubmit="loginUser(event)">

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email Address</label>

                <input type="email" id="email" class="form-control" placeholder="Enter your email">
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">Password</label>

                <input type="password" id="password" class="form-control" placeholder="Enter your password">
            </div>

            <!-- Error -->
            <div id="error"></div>

            <!-- Login Button -->
            <button type="submit" class="login-btn mt-3">
                <i class="fa-solid fa-right-to-bracket me-2"></i>
                Login
            </button>

        </form>

    </div>


    <script>

        function loginUser(event) {

            event.preventDefault();

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let error = document.getElementById("error");

            if (email === "" || password === "") {

                error.innerHTML = "Please enter email and password.";
                return;
            }

            // Save login status
            localStorage.setItem("loggedIn", "true");

            // Open Home Page
            window.location.href = "index.html";
        }

    </script>

</body>

</html>
